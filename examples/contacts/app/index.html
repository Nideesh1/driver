<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northwind CRM</title>
    <!-- The tab icon, inline.

         A page that declares no icon is a page the browser asks for
         `/favicon.ico` anyway, and this demo's server answers 404 — which is
         a console error, which is a failing assertion in
         `e2e/smoke.spec.mjs`'s "loads with no console errors". Bundled
         chromium does not make that request and real Chrome does, so the
         suite passed under Playwright's browser and failed under
         `DK_CHANNEL=chrome`, which is the configuration closest to what
         somebody actually runs.

         A data URI rather than a file, because the demo is served by
         `examples/contacts/server.mjs` from a short allow-list of paths and an
         icon is not worth a route. It is the same rounded square and the same
         `--accent` as the brand mark in the rail. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5eff'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='14' font-weight='700' fill='%23fff'%3ENW%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark">NW</span>
          <span class="brand-name">Northwind</span>
        </div>
        <!-- Real links, not buttons. A nav item is a URL in this app, so
             middle-click, copy-link and the browser's own back button all work
             without a line of JavaScript; `app.js` only listens for
             `hashchange`. The `data-screen` is how the renderer marks the
             current one. -->
        <nav class="nav" id="nav">
          <a class="nav-item" data-screen="dashboard" href="#/dashboard">Dashboard</a>
          <a class="nav-item" data-screen="contacts" href="#/contacts">Contacts</a>
          <a class="nav-item" data-screen="companies" href="#/companies">Companies</a>
          <a class="nav-item" data-screen="settings" href="#/settings">Settings</a>
        </nav>
        <div class="rail-foot">
          <div class="conn">
            <span class="conn-dot" id="conn-dot" data-state="connecting"></span>
            <span id="conn-text">connecting to relay…</span>
          </div>
          <p class="rail-note">
            Six screens, drivable two ways: the panel in the corner, and any
            agent that can reach the relay mounted at <code>/dk</code>.
          </p>
        </div>
      </aside>

      <!-- One mount point. Every screen is drawn into here by `screens.js`
           from the store's route, so there is exactly one place where "what is
           on screen" is decided, and `visible()` reads the same route. A
           per-screen <section hidden> would have let the DOM and the snapshot
           disagree about where the user is, which is the one thing a driver
           must never be wrong about. -->
      <main class="main" id="screen" aria-live="polite"></main>
    </div>

    <!-- No import map. There used to be one, for a single bare specifier:
         the built widget imported drive() from @driverkit/agent, and a
         <script type="module"> resolves relative URLs only -- there is no
         node_modules walk in a browser. One package later that import is a
         relative path inside dist/, so the whole entry is gone and the built
         files load from a plain static host as they stand. The packaging test
         pins that no bare specifier comes back. -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
