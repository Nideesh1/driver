<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northwind CRM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark">NW</span>
          <span class="brand-name">Northwind</span>
        </div>
        <!-- Real links, not buttons. A nav item is a URL in this app, so
             middle-click, copy-link and the browser's own back button all work
             without a line of JavaScript; `app.js` only listens for
             `hashchange`. The `data-screen` is how the renderer marks the
             current one. -->
        <nav class="nav" id="nav">
          <a class="nav-item" data-screen="dashboard" href="#/dashboard">Dashboard</a>
          <a class="nav-item" data-screen="contacts" href="#/contacts">Contacts</a>
          <a class="nav-item" data-screen="companies" href="#/companies">Companies</a>
          <a class="nav-item" data-screen="settings" href="#/settings">Settings</a>
        </nav>
        <div class="rail-foot">
          <div class="conn">
            <span class="conn-dot" id="conn-dot" data-state="connecting"></span>
            <span id="conn-text">connecting to relay…</span>
          </div>
          <p class="rail-note">
            Six screens, drivable two ways: the panel in the corner, and any
            agent that can reach the relay mounted at <code>/dk</code>.
          </p>
        </div>
      </aside>

      <!-- One mount point. Every screen is drawn into here by `screens.js`
           from the store's route, so there is exactly one place where "what is
           on screen" is decided, and `visible()` reads the same route. A
           per-screen <section hidden> would have let the DOM and the snapshot
           disagree about where the user is, which is the one thing a driver
           must never be wrong about. -->
      <main class="main" id="screen" aria-live="polite"></main>
    </div>

    <!-- The built @driverkit/widget carries one bare specifier (it imports
         drive() and commas() from @driverkit/agent at runtime). A
         <script type="module"> resolves relative URLs only -- there is no
         node_modules walk in a browser -- so it needs naming here. This is
         the ONLY such entry, and the packaging test pins that it stays so. -->
    <script type="importmap">
    { "imports": { "@driverkit/agent": "../../../packages/agent/dist/index.js" } }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
